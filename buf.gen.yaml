version: v2

# TODO(LASTMILE-011): BSR remote plugins are unreachable from this environment
# (403); the same plugin binaries are invoked locally:
#   protoc-gen-go v1.36.12, protoc-gen-go-grpc v1.5.1, protoc-gen-validate v1.1.0
# Generated code lands in pkg/gen (same layout as the upstream repo).
plugins:
  - local: protoc-gen-go
    out: pkg/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: pkg/gen
    opt: paths=source_relative
  - local: protoc-gen-validate
    out: pkg/gen
    opt: paths=source_relative,lang=go