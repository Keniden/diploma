syntax = "proto3";

package proto.v1.public.driver.shipment;


import "api/proto/v1/public/driver/route_point/enums.proto";
import "api/proto/v1/public/driver/shipment/enums.proto";
import "api/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "last-mile-task/pkg/gen/api/proto/v1/public/driver/shipment;shipmentv1";

// Shipment перевозка.
//
// TODO(LASTMILE-008): simplified — the real contract carries a WorkSchedule
// subgraph that is not used by the skeleton flows.
message Shipment {
  string id = 1 [(validate.rules).string.uuid = true]; // Идентификатор перевозки.
  Status status = 2; // Статус.
  Route route = 3; // Маршрут.
  int64 short_id = 4; // Короткий числовой идентификатор перевозки.
  optional Reserve reserve = 5; // Активный резерв ворот.

  // Reserve резерв ворот.
  message Reserve {
    optional google.protobuf.Timestamp expires_at = 1; // Время истечения резерва.
    optional google.protobuf.Timestamp created_at = 2; // Время последнего обновления резерва.
  }

  // Route маршрут.
  message Route {
    string id = 1 [(validate.rules).string.uuid = true]; // Идентификатор маршрута.
    repeated Point points = 2; // Точки маршрута.

    // Point точка маршрута.
    message Point {
      string id = 1 [(validate.rules).string.uuid = true]; // Идентификатор точки маршрута.
      string address = 2; // Адрес точки маршрута.
      int32 seq_num = 3; // Порядковый номер точки внутри маршрута.
      int32 package_count = 4; // Количество грузомест, которые нужно выгрузить на точке.
      string short_id = 5; // Короткий идентификатор точки маршрута.
      proto.v1.public.driver.route_point.RoutePointStatus status = 7; // Статус точки маршрута.
    }
  }
}