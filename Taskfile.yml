version: '3'

vars:
  DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/last_mile?sslmode=disable'
  MIGRATIONS_DIR: 'migrations'

tasks:
  default:
    desc: Run all tests
    cmds:
      - task: test

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  proto:
    desc: Generate proto code via buf into pkg/gen
    cmds:
      - buf generate

  migrate:
    desc: Apply goose migrations from migrations/
    cmds:
      - go run ./cmd/migrate '{{.DATABASE_URL}}'

  run:
    desc: Run the service (mock mode by default)
    cmds:
      - go run .